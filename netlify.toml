# Netlify Production Configuration for ProLink Web App

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Supabase URL + anon key are public by design (security is enforced by RLS).
  VITE_SUPABASE_URL = "https://ubeqmsyyyojojmswmidq.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViZXFtc3l5eW9qb2ptc3dtaWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NDMzNTcsImV4cCI6MjEwMzUxOTM1N30.sc4MWy_zn0bY3XaCZfwtt5kBTMSd84hiAfhevOwOj_0"
  # Secret keys (Gemini, Telegram) must NEVER be set here. They live in Supabase
  # Edge Function secrets: GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_SUPPORT_CHAT_ID.

# Single Page Application (SPA) Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Performance HTTP Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
